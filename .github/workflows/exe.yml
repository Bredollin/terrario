# Gera o Terrario.exe no Windows a cada PR e a cada merge na main.
# PR: o exe fica nos artefatos da execucao. Main: vira uma Release com o exe.
name: exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Versao
        id: versao
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Terrario-${{ steps.versao.outputs.v }}
          path: dist/Terrario.exe
          retention-days: 14
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Terrario ${{ steps.versao.outputs.v }}
          files: dist/Terrario.exe
          make_latest: true
          body: |
            Baixe o `Terrario.exe` abaixo. É portátil: não precisa instalar.
            Se o Windows avisar "O Windows protegeu o computador", clique em "Mais informações" e "Executar assim mesmo" (o app não tem assinatura digital).
