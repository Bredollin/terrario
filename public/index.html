<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="tela" aria-label="Terrário com criaturas digitais"></canvas>

  <header class="marca">
    <h1>TERRÁRIO</h1>
    <p>criaturas que caçam conhecimento</p>
  </header>

  <div class="dica" id="dica">clique numa criatura para cutucar · solte um link nela para ela ler</div>

  <section class="doca" aria-label="Controles">
    <div class="topo-elenco">
      <span class="rotulo">criaturas <b id="contagem"></b></span>
      <button type="button" class="mini sozinhas" id="btn-sozinhas" role="switch" aria-checked="true" title="Sem tema dado, cada criatura escolhe um e caça a cada 3 minutos">caçam sozinhas</button>
      <button type="button" class="mini chave" id="btn-area" role="switch" aria-checked="false" style="--k:#ffd23f" title="As criaturas ligadas saem do terrário e andam pela tela toda, por cima das janelas, sem atrapalhar o clique">soltar na área de trabalho</button>
      <button type="button" class="mini" id="btn-todas">ligar todas</button>
      <button type="button" class="mini" id="btn-nenhuma">desligar todas</button>
    </div>
    <div class="criaturas" id="lista"></div>
    <form class="caca" id="form-caca">
      <span class="alvo" id="alvo"></span>
      <input id="tema" name="tema" autocomplete="off" maxlength="120" placeholder="tema para caçar… ex.: centopeias, auroras, polvos">
      <button type="submit" id="btn-cacar">Caçar</button>
    </form>
    <div class="acoes">
      <button type="button" id="btn-nova" title="Chocar uma criatura nova">+ criatura</button>
      <button type="button" id="btn-batizar" title="Dar outro nome à criatura escolhida">batizar</button>
      <button type="button" id="btn-saber" class="saber">conhecimento <b id="qtd">0</b></button>
      <button type="button" id="btn-protetor" class="chave" role="switch" aria-checked="false" style="--k:#3ee6ff" title="Protetor de tela animado do Windows: entra quando o PC fica parado e, ao sair, pede a senha">protetor de tela</button>
      <button type="button" id="btn-bloqueio" class="chave" role="switch" aria-checked="false" title="Uma imagem nova (um instante do protetor) na tela de bloqueio a cada Win+L">imagem no bloqueio</button>
      <button type="button" id="btn-previa" title="Ver o protetor de tela rodando">prévia</button>
    </div>
  </section>

  <aside class="gaveta" id="gaveta" aria-label="Conhecimento gravado" hidden>
    <header>
      <h2>Conhecimento</h2>
      <button type="button" id="btn-fechar" aria-label="Fechar">×</button>
    </header>
    <p class="sub" id="gaveta-sub">o que as criaturas trouxeram, em markdown</p>
    <div id="itens"></div>
  </aside>

  <div class="previa" id="previa" hidden>
    <iframe id="previa-quadro" title="Prévia do protetor de tela" allow="fullscreen"></iframe>
    <div class="previa-barra">
      <span id="previa-legenda"></span>
      <button type="button" id="previa-outra">próximo movimento</button>
      <button type="button" id="previa-cheia">tela cheia</button>
      <button type="button" id="previa-fechar">fechar</button>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>

  <script type="module" src="terrario.js"></script>
</body>
</html>
